<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home – Recipe Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container py-3 py-md-4">
    <div class="app-frame d-flex flex-md-column gap-3 gap-md-4 p-3 p-md-4">

      <nav class="app-nav d-flex flex-column flex-md-row gap-2" aria-label="Main menu">
        <a class="btn btn-mint active" href="index.html" target="_blank" rel="noopener" aria-current="page">Home</a>
        <a class="btn btn-mint" href="cookbook.html" target="_blank" rel="noopener">Cookbook</a>
        <a class="btn btn-mint" href="addrecipe.html" target="_blank" rel="noopener">Add Recipe</a>
        <a class="btn btn-mint" href="profile.html" target="_blank" rel="noopener">Profile</a>
      </nav>

      <main class="flex-grow-1 min-w-0">
        <div class="row g-4">

          <section class="col-md-5 d-flex flex-column">
            <h1 class="h3 mb-3">Shopping List</h1>
            <ul class="list-unstyled app-notes mb-3">
              <li>For: shakshuka and Sunday pancakes</li>
              <li>Store: Kaufland, Saturday morning</li>
              <li>Budget: about 80 lei</li>
            </ul>
            <button class="btn btn-mint mt-auto align-self-start" type="button">Save list</button>
          </section>

          <section class="col-md-7">
            <table class="table table-bordered align-middle app-table mb-0">
              <thead>
                <tr>
                  <th scope="col">Quantity</th>
                  <th scope="col">Name</th>
                  <th scope="col" class="text-center"><span class="visually-hidden">Bought</span></th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>2</td>
                  <td>Tomatoes</td>
                  <td class="text-center"><input class="form-check-input" type="checkbox" checked aria-label="Tomatoes bought"></td>
                </tr>
                <tr>
                  <td>4</td>
                  <td>Eggs</td>
                  <td class="text-center"><input class="form-check-input" type="checkbox" aria-label="Eggs bought"></td>
                </tr>
                <tr>
                  <td>3</td>
                  <td>Onions</td>
                  <td class="text-center"><input class="form-check-input" type="checkbox" checked aria-label="Onions bought"></td>
                </tr>
                <tr>
                  <td>1 kg</td>
                  <td>Flour</td>
                  <td class="text-center"><input class="form-check-input" type="checkbox" aria-label="Flour bought"></td>
                </tr>
                <tr>
                  <td>1 l</td>
                  <td>Milk</td>
                  <td class="text-center"><input class="form-check-input" type="checkbox" aria-label="Milk bought"></td>
                </tr>
                <tr>
                  <td>200 g</td>
                  <td>Feta cheese</td>
                  <td class="text-center"><input class="form-check-input" type="checkbox" aria-label="Feta cheese bought"></td>
                </tr>
              </tbody>
            </table>
          </section>

        </div>
      </main>

    </div>
  </div>
</body>
</html>
